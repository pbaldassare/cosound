[package]
name = "cosound"
version = "0.1.0"
description = "COSOUND desktop app"
edition = "2021"

[lib]
name = "cosound_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# TEMPORARY: development-only test connector for the Agent Integration Layer.
# Never enabled in release builds. Remove when the real central Agent is integrated.
temp-connector = []

[dependencies]
plist = "1.10.4"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sysinfo = { version = "0.40.4", default-features = false, features = ["disk"] }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
uuid = { version = "1.29.3", features = ["v4"] }
walkdir = "2.5.1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3.27.0"
