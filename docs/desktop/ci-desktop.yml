# Builds and tests the desktop app on macOS and Windows (and Linux).
# Produces UNSIGNED test builds only: not for distribution (no Apple notarization / Windows code signing yet).
name: desktop

on:
  push:
    paths: ['desktop/**', 'packages/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', 'packages/**']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: npm ci
      - name: Rust tests (incl. temporary test connector)
        working-directory: desktop/src-tauri
        run: cargo test --features temp-connector
      - name: Type check
        run: npx tsc -p .
      - name: Build app and installers (unsigned)
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: cosound-unsigned-test-build-${{ matrix.os }}
          path: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: ignore
          retention-days: 7
